<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature converter</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="main-container">
        <div class="converter-card">
            <h1>Temperature Converter</h1>
            <div class="input-section">
                <input type="text" id="celsiusDegree" placeholder="0" autocomplete="off">
                <span class="unit-label">Celsius (°C)</span>
            </div>
            <button id="convertBtn">Convert temperature</button>
            <div class="results-section" id="results">
                <div class="result-box">
                    <span class="label">Fahrenheit</span>
                    <span class="value" id="fahrenheitValue">--</span>
                </div>
                <div class="result-box">
                    <span class="label">Kelvin</span>
                    <span class="value" id="kelvinValue">--</span>
                </div>
            </div>
            <p id="errorOutput" class="error-text"></p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
